function renderDiaryPage(){
  if(!diaries.length){
    return `<div class="page">
      <div class="empty">${emptyArt()}<b>还没有日记</b><p>把今天的心情写下来，好友会来回复你。</p></div>
      <div style="padding:0 20px"><button class="btn block ghost" type="button" data-act="diary-add">${icon('i-edit')} 写第一篇日记</button></div>
    </div>`;
  }
  return `<div class="page">${diaries.map(diaryHTML).join('')}</div>`;
}

function diaryHTML(d){
  const expanded = ui.diaryExpanded.has(d.id);
  const text = d.text || '';
  const long = text.length > 220;
  const shown = expanded || !long ? text : text.slice(0, 220) + '…';
  const comments = d.comments || [];
  const dd = new Date(d.at);
  return `<div class="diary-card" data-act="diary-open" data-id="${d.id}" role="button">
    <div class="diary-head">
      <div class="diary-date"><b>${dd.getDate()}</b><span>${dd.getMonth()+1}月</span></div>
      <div class="grow">
        <div class="diary-title">${esc(d.title || '无题')}</div>
        <div class="diary-meta">${fmtFull(d.at)} · ${text.length} 字</div>
      </div>
      <div class="diary-tools">
        <button class="diary-tool" type="button" data-act="diary-edit" data-id="${d.id}" aria-label="编辑">${icon('i-edit','sm')}</button>
        <button class="diary-tool" type="button" data-act="diary-del" data-id="${d.id}" aria-label="删除">${icon('i-trash','sm')}</button>
      </div>
    </div>
    <div class="diary-body">${esc(shown)}</div>
    ${long ? `<button class="btn tiny ghost" type="button" data-act="diary-toggle" data-id="${d.id}" style="margin-top:9px">${expanded ? '收起' : '展开全文'}</button>` : ''}
    ${comments.length ? `<div class="diary-replies">${comments.map(c => `<div class="diary-reply"><b>${esc(c.name)}</b>：${esc(c.text)}</div>`).join('')}</div>` : ''}
  </div>`;
}

function openDiaryForm(diary=null){
  const isEdit = !!diary;
  openSheet({
    title: isEdit ? '编辑日记' : '写日记',
    body:`<div class="field"><label>标题（可选）</label><input class="input" id="diTitle" maxlength="40" value="${esc(diary?.title || '')}" placeholder="给这一天起个名字"></div>
      <div class="field"><label>内容</label><textarea class="textarea" id="diText" maxlength="8000" style="min-height:180px" placeholder="写下今天发生的事…">${esc(diary?.text || '')}</textarea></div>
      <p class="form-note">${isEdit ? '修改不会重新触发好友回复。' : '保存后，好友可能会来过问几句。'}</p>`,
    footer:`<button class="btn soft" type="button" data-close>取消</button><button class="btn" type="button" id="diSave">保存</button>`,
    onMount(el, close){
      setTimeout(() => { const t = el.querySelector('#diText'); if(t) t.focus(); }, 120);
      el.querySelector('#diSave').onclick = async () => {
        const text = el.querySelector('#diText').value.trim();
        if(!text) return toast('日记内容不能为空');
        const title = el.querySelector('#diTitle').value.trim();
        if(isEdit){
          diary.title = title;
          diary.text = text;
          diary.updatedAt = Date.now();
          await dbPut('diaries', diary);
        }else{
          const rec = {id:'di_'+uid(), title, text, at:Date.now(), comments:[]};
          await dbPut('diaries', rec);
          diaries.unshift(rec);
          scheduleDiaryReplies(rec);
        }
        close();
        toast(isEdit ? '日记已更新' : '日记已保存');
        softRender();
      };
    }
  });
}

function scheduleDiaryReplies(diary){
  if(!friends.length) return;
  setTimeout(async () => {
    const fresh = diaries.find(x => x.id === diary.id);
    if(!fresh) return;
    const pool = friends.slice().sort(() => Math.random() - 0.5);
    const count = 1 + Math.floor(Math.random()*Math.min(2, pool.length));
    const lines = ['看完了，抱抱你。','这一天辛苦了。','写下来就很好。','我懂那种感觉。','明天会更好一点。','记得早点休息。'];
    fresh.comments = [...(fresh.comments || [])];
    for(let i = 0; i < count; i++){
      const f = pool[i % pool.length];
      fresh.comments.push({id:'cmt_'+uid(), userId:f.id, name:f.name, text:pick(lines), at:Date.now()});
    }
    await dbPut('diaries', fresh);
    if(view.name === 'diary') softRender();
  }, 6000 + Math.random()*12000);
}

async function deleteDiary(id){
  const ok = await confirmDialog({title:'删除日记', message:'确定删除这篇日记吗？好友的回复也会一起消失。', danger:true, confirmText:'删除'});
  if(!ok) return;
  await dbDelete('diaries', id);
  diaries = diaries.filter(x => x.id !== id);
  ui.diaryExpanded.delete(id);
  toast('日记已删除');
  softRender();
}

document.addEventListener('click', async e => {

  const id = trigger.dataset.id;
  const chat = view.name === 'chat' ? chatById(view.id) : null;
  switch(act){
    case 'tab':
      switchTab(trigger.dataset.tab);
      break;
    case 'go':
      navigate(trigger.dataset.view);
      break;
    case 'back':
      goBack();
      break;
    case 'go-me':
      switchTab('me');
      break;
    case 'new-chat':
      openNewMenu();
      break;
    case 'contact-add':
      openContactAdd();
      break;
    case 'open-chat':
      openChat(id);
      break;

      ui.contactsTab = trigger.dataset.tab;
      render();
      break;
    case 'friend-open':
      openFriendDetail(id);
      break;
    case 'group-open':
      openGroupDetail(id);
      break;
    case 'friendgroup-menu':
      openFriendGroupMenu(id);
      break;
    case 'friendgroup-add':
      openFriendGroupForm();
      break;
    case 'lib-tab':
      ui.libraryTab = trigger.dataset.type;
      ui.librarySel.clear();
      render();
      scrollLibTabsToActive();
      break;
    case 'lib-item':
      if(ui.libraryManage) toggleLibSelection(id);
      else openLibItemSheet(id);
      break;
    case 'lib-manage':
      ui.libraryManage = !ui.libraryManage;
      ui.librarySel.clear();
      render();
      break;
    case 'lib-selectall': {
      const items = library.filter(x => x.type === ui.libraryTab);
      const all = items.length && items.every(x => ui.librarySel.has(x.id));
      ui.librarySel.clear();
      if(!all) items.forEach(x => ui.librarySel.add(x.id));
      render();
      break;
    }
    case 'lib-delete':
      deleteSelectedLib();
      break;
    case 'lib-add':
      openLibAddSheet();
      break;
    case 'plib-friend':
      ui.plibFriend = id;
      ui.plibSel.clear();
      render();
      break;
    case 'plib-tab':
      ui.plibType = trigger.dataset.type;
      ui.plibSel.clear();
      render();
      scrollLibTabsToActive();
      break;
    case 'plib-item':
      if(ui.plibManage) togglePlibSelection(id);
      break;
    case 'lib-toggle': {
      const item = library.find(x => x.id === id);
      if(!item) break;
      item.disabled = !item.disabled;
      await dbPut('library', item);
      toast(item.disabled ? '已禁用，发送时不会再出现' : '已启用');
      render();
      break;
    }
    case 'plib-toggle': {
      const item = privateLibrary.find(x => x.id === id);
      if(!item) break;
      item.disabled = !item.disabled;
      await dbPut('privateLibrary', item);
      toast(item.disabled ? '已禁用，TA 不会再使用这条' : '已启用');
      render();
      break;
    }
    case 'plib-manage':
      ui.plibManage = !ui.plibManage;
      ui.plibSel.clear();
      render();
      break;
    case 'plib-selectall': {
      const items = privateLibrary.filter(x => x.friendId === ui.plibFriend && x.owner === 'friend' && x.type === ui.plibType);
      const all = items.length && items.every(x => ui.plibSel.has(x.id));
      ui.plibSel.clear();
      if(!all) items.forEach(x => ui.plibSel.add(x.id));
      render();
      break;
    }
    case 'plib-delete':
      deleteSelectedPlib();
      break;
    case 'plib-add': {

      if(!fid) { toast('请先选择好友'); break; }
      if(ui.plibType === 'sticker'){
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
        input.onchange = async () => {
          const files = Array.from(input.files || []);
          let added = 0;
          for(const file of files){
            try{
              const data = await readImageFile(file, 360);
              await addPrivateItem(fid, 'friend', 'sticker', data, 'TA 的表情');
              added++;
            }catch(err){}
          }
          if(added) toast('已添加 ' + added + ' 个表情');
          render();
        };
        input.click();

        openPrivateAddForm(fid, 'friend', ui.plibType, () => render());
      }
      break;
    }
    case 'theme-color': {
      const target = trigger.dataset.target;
      if(['bg','me','other'].includes(target)){

        await saveSettings();
        softRender();

    case 'theme-font':

    case 'clear-all':

    case 'tx-del':

    case 'balance-edit':

      break;
    case 'moment-add':

document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]');
  if(!el) return;
  const key = el.dataset.input;
  if(key === 'conv-search'){
    ui.messagesFilter = el.value;
    refreshConvList();
  }else if(key === 'delayMin' || key === 'delayMax'){
    const v = Number(el.value);
    const n = Number.isFinite(v) && el.value !== '' ? Math.min(3600, Math.max(1, Math.round(v))) : (key === 'delayMin' ? 30 : 60);
    settings.pace[key] = n;
    if(settings.pace.delayMax < settings.pace.delayMin) settings.pace.delayMax = settings.pace.delayMin;
    saveSettings();
  }else if(key === 'autoMin' || key === 'autoMax'){
    const v = Number(el.value);
    const n = Number.isFinite(v) && el.value !== '' ? Math.min(10, Math.max(1, Math.round(v))) : 1;
    settings.pace[key] = n;
    if(settings.pace.autoMax < settings.pace.autoMin) settings.pace.autoMax = settings.pace.autoMin;
    saveSettings();
  }else if(key === 'count'){
    const v = Number(el.value);
    settings.pace.count = Number.isFinite(v) ? Math.min(10, Math.max(1, Math.round(v))) : 1;
    saveSettings();
  }else if(key === 'theme-custom'){
    const target = el.dataset.target;
    if(['bg','me','other'].includes(target)){
      settings.theme[target] = el.value;
      saveSettings();
    }
  }else if(key === 'patMe'){
    settings.display.patMe = el.value;
    saveSettings();
  }else if(key === 'patOther'){
    settings.display.patOther = el.value;
    saveSettings();
  }
});

document.addEventListener('change', e => {
  const importInput = e.target.closest('#importFile');
  if(importInput){
    const file = importInput.files && importInput.files[0];
    if(file) handleImportFile(file);
    importInput.value = '';
    return;
  }
  if(e.target.matches('[data-input="theme-custom"]')){
    softRender();
    return;
  }
  const el = e.target.closest('[data-change]');
  if(!el) return;
  const group = el.dataset.change;
  const key = el.dataset.key;
  if(settings[group]) settings[group][key] = el.checked;
  saveSettings();
});

document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.matches('[role="button"][data-act]')){
    e.preventDefault();
    e.target.click();
  }
});

/* 同步可视高度：兼容手机内置浏览器动态工具栏造成的 100dvh 偏差 */
function syncAppHeight(){
  const h = window.innerHeight || document.documentElement.clientHeight || 0;
  if(h > 0) document.documentElement.style.setProperty('--app-height', h + 'px');
}
syncAppHeight();
window.addEventListener('resize', syncAppHeight);
window.addEventListener('pageshow', syncAppHeight);
window.addEventListener('orientationchange', () => setTimeout(syncAppHeight, 180));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', syncAppHeight);
}

function showWelcomeSheet(){
  openSheet({
    title:'欢迎来到「世界」',
    body:`<div style="text-align:center;padding:4px 0 2px">
        <img src="${genAvatar('世界', 214)}" alt="" style="width:76px;height:76px;border-radius:24px;margin:0 auto 14px">
        <p style="font-size:13px;line-height:1.85;color:var(--text-2);text-align:left">这里是只属于你的私人聊天空间。好友、群聊、聊天记录、朋友圈和日记都保存在本设备的 IndexedDB 中，不会上传到任何服务器。</p>
        <div class="card card-pad" style="text-align:left;margin-top:12px;box-shadow:none;background:rgba(221,107,155,.05)">
          <div class="card-title" style="font-size:12.5px">可以这样开始</div>
          <p style="font-size:11.5px;line-height:1.95;color:var(--text-2);margin-top:5px">· 在「联系人」里添加好友、创建分组<br>· 在「消息」右上角发起单聊或群聊<br>· 到「设置 → 公共词条库」添加你们常用的句子<br>· 在「我的」里记录账户、朋友圈和日记</p>
        </div>
      </div>`,
    footer:`<button class="btn" type="button" data-close>开始使用</button>`
  });
}

async function boot(){
  try{
    await openDB();
    await loadAll();
  }catch(err){
    console.error(err);
    const app = $('#app');
    if(app){
      app.innerHTML = `<div class="page" style="padding-top:50px"><div class="empty">${emptyArt()}<b>无法打开本地数据库</b><p>${esc(err.message || '未知错误')}<br>请确认浏览器允许使用 IndexedDB，隐私模式可能会限制存储。</p></div></div>`;
    }
    return;
  }
  booted = true;
  bindMsgActions();
  lastAutoSend = Date.now();
  render();

  if(!settings.welcomeSeen){
    settings.welcomeSeen = true;
    settings.lastSeen = Date.now();
    await saveSettings();
    setTimeout(showWelcomeSheet, 420);
  }else{
    const unread = chats.reduce((sum, c) => sum + (c.unread || 0), 0);
    if(settings.display.leavePopup && unread > 0){
      setTimeout(() => {
        confirmDialog({
          title:'欢迎回来',
          message:`「世界」里有 ${unread} 条未读消息在等你。`,
          confirmText:'去看看'
        }).then(ok => { if(ok) switchTab('messages'); });
      }, 420);
    }
    settings.lastSeen = Date.now();
    saveSettings();
  }

  window.addEventListener('beforeunload', e => {
    if(settings && settings.display.leavePopup){
      e.preventDefault();
      e.returnValue = '';
    }
  });
}

boot().catch(err => {
  console.error(err);
  const app = $('#app');
  if(app){
    app.innerHTML = `<div class="page"><div class="empty">${emptyArt()}<b>启动失败</b><p>${esc(err.message || '未知错误')}</p></div></div>`;
  }
});
</script>
</body>
