function hexToRgb(hex){
  let h = String(hex||'').replace('#','').trim();
  if(h.length === 3) h = h.split('').map(c=>c+c).join('');
  if(h.length !== 6 || /[^0-9a-f]/i.test(h)) return {r:255,g:255,b:255};
  return { r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16) };
}
function contrastText(hex){
  const {r,g,b} = hexToRgb(hex);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.62 ? '#18202f' : '#ffffff';
}

/* ---------- IndexedDB ---------- */
function reqP(req){
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function openDB(){
  if(db) return Promise.resolve(db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('profile')) d.createObjectStore('profile', {keyPath:'id'});
      if(!d.objectStoreNames.contains('friends')){
        const s = d.createObjectStore('friends', {keyPath:'id'});
        s.createIndex('groupId','groupId');
      }
      if(!d.objectStoreNames.contains('friendGroups')) d.createObjectStore('friendGroups', {keyPath:'id'});
      if(!d.objectStoreNames.contains('groupChats')) d.createObjectStore('groupChats', {keyPath:'id'});
      if(!d.objectStoreNames.contains('chats')){
        const s = d.createObjectStore('chats', {keyPath:'id'});
        s.createIndex('refId','refId');
      }
      if(!d.objectStoreNames.contains('messages')){
        const s = d.createObjectStore('messages', {keyPath:'id'});
        s.createIndex('chatId','chatId');
        s.createIndex('at','at');
      }
      if(!d.objectStoreNames.contains('library')){
        const s = d.createObjectStore('library', {keyPath:'id'});
        s.createIndex('type','type');
      }
      if(!d.objectStoreNames.contains('moments')){
        const s = d.createObjectStore('moments', {keyPath:'id'});
        s.createIndex('at','at');
      }
      if(!d.objectStoreNames.contains('diaries')){
        const s = d.createObjectStore('diaries', {keyPath:'id'});
        s.createIndex('at','at');
      }
      if(!d.objectStoreNames.contains('ledger')){
        const s = d.createObjectStore('ledger', {keyPath:'id'});
        s.createIndex('at','at');
      }
      if(!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', {keyPath:'key'});
      if(!d.objectStoreNames.contains('_extra')) d.createObjectStore('_extra', {keyPath:'key'});
      if(!d.objectStoreNames.contains('privateLibrary')){
        const s = d.createObjectStore('privateLibrary', {keyPath:'id'});
        s.createIndex('friendId','friendId');
      }
      if(!d.objectStoreNames.contains('friendMeta')) d.createObjectStore('friendMeta', {keyPath:'id'});
      if(!d.objectStoreNames.contains('polls')){
        const s = d.createObjectStore('polls', {keyPath:'id'});
        s.createIndex('chatId','chatId');
      }
      if(!d.objectStoreNames.contains('questionnaires')){
        const s = d.createObjectStore('questionnaires', {keyPath:'id'});
        s.createIndex('chatId','chatId');
      }
      if(!d.objectStoreNames.contains('letters')){
        const s = d.createObjectStore('letters', {keyPath:'id'});
        s.createIndex('friendId','friendId');
      }
      if(!d.objectStoreNames.contains('friendPosts')){
        const s = d.createObjectStore('friendPosts', {keyPath:'id'});
        s.createIndex('friendId','friendId');
        s.createIndex('at','at');
      }
    };
    req.onsuccess = () => {
      db = req.result;
      db.onversionchange = () => { try{ db.close(); }catch(e){} db = null; };
      resolve(db);
    };
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('数据库被其他页面占用'));
  });
}
function dbGet(store, key){
  return openDB().then(d => reqP(d.transaction(store,'readonly').objectStore(store).get(key)));
}
function dbGetAll(store){
  return openDB().then(d => reqP(d.transaction(store,'readonly').objectStore(store).getAll()));
}
function dbPut(store, value){
  return openDB().then(d => reqP(d.transaction(store,'readwrite').objectStore(store).put(value)));
}
function dbDelete(store, key){
  return openDB().then(d => reqP(d.transaction(store,'readwrite').objectStore(store).delete(key)));
}
function dbClear(store){
  return openDB().then(d => reqP(d.transaction(store,'readwrite').objectStore(store).clear()));
}
function dbCount(store){
  return openDB().then(d => reqP(d.transaction(store,'readonly').objectStore(store).count()));
}
function dbByIndex(store, index, value){
  return openDB().then(d => reqP(d.transaction(store,'readonly').objectStore(store).index(index).getAll(value)));
}
function dbBulkPut(store, records){
  return openDB().then(d => new Promise((resolve, reject) => {
    const tx = d.transaction(store,'readwrite');
    const os = tx.objectStore(store);
    for(const rec of records) os.put(rec);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  }));
}

function mergeDeep(base, extra){
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  if(!extra || typeof extra !== 'object') return out;
  for(const k of Object.keys(extra)){
    const bv = base ? base[k] : undefined;
    const ev = extra[k];
    if(ev && typeof ev === 'object' && !Array.isArray(ev) && bv && typeof bv === 'object' && !Array.isArray(bv)){
      out[k] = mergeDeep(bv, ev);
    } else if(ev !== undefined){
      out[k] = ev;
    }
  }
  return out;
}

function composeFromPool(friendId, min, max, types, opts={}){
  const pool = libTextPool(friendId, types);
  if(!pool.length) return '';
  const n = min + Math.floor(Math.random() * (max - min + 1));
  const out = [];
  for(let i=0;i<n;i++){
    let s = opts.unique ? '' : pick(pool);
    if(opts.unique){
      const remain = pool.filter(x => !out.includes(x));
      s = pick(remain.length ? remain : pool);
    }
    const last = out[out.length-1];
    if(s && s !== last) out.push(s);
  }
  return out.join(opts.sep || '\n');
}

  if(m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
  return age >= 0 ? age + ' 岁' : '—';

/* ---------- 图片与文件 ---------- */
function readImageFile(file, maxSize=360){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('读取失败'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('图片格式不支持'));
      img.onload = () => {
        try{
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width*scale));
          const h = Math.max(1, Math.round(img.height*scale));
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0,0,w,h);
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', 0.86));
        }catch(err){ reject(err); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function downloadFile(filename, content, mime='application/octet-stream'){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1200);
}
function stampName(){
  const d = new Date();
  return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
}

  return `<svg class="ic ${cls}" aria-hidden="true"><use href="#${name}"></use></svg>`;
}

function render(){
  if(!booted) return;
  closeMsgMenu();
  if(view.name === 'chat'){ renderChatScreen(); return; }
  resetChatTheme();
  const app = $('#app');
  const tabView = ['messages','contacts','settings','me'].includes(view.name);
  app.innerHTML = renderTopbar() + `<main class="main" id="main">${renderMainContent()}</main>` + (tabView ? renderTabbar() : '');
  const main = $('#main');
  if(main) main.scrollTop = 0;
  afterRender();
}

function switchTab(tab){
  if(!['messages','contacts','settings','me'].includes(tab)) return;
  history = [];
  view = { name: tab };
  render();
}
function navigate(name, params={}){
  history.push(Object.assign({}, view));
  view = Object.assign({ name }, params);
  render();
}
function goBack(){
  view = history.pop() || { name:'messages' };
  render();
}

function currentTab(){
  if(['messages','contacts','settings','me'].includes(view.name)) return view.name;
  return null;
}

function renderTabbar(){
  const tabs = [
    ['messages','消息','i-chat'],
    ['contacts','联系人','i-users'],
    ['settings','设置','i-settings'],
    ['me','我的','i-user']
  ];
  return `<nav class="tabbar">${tabs.map(([key,label,ic]) => `
    <button class="tab-item ${view.name===key?'on':''}" data-act="tab" data-tab="${key}" aria-label="${label}">
      ${icon(ic)}
      <span>${label}</span>
    </button>`).join('')}</nav>`;
}

const SUB_TITLES = {
  library:'公共词条库', privateLib:'私人词条库', theme:'全局装扮', chatSettings:'聊天设置',
  storage:'存储显示', transfer:'导出导入', account:'账户', moments:'朋友圈', diary:'日记'
};

function renderTopbar(){
  const v = view.name;
  if(v === 'messages'){
    return `<header class="topbar">
      <button class="me-chip" data-act="go-me" aria-label="我的资料">
        <img src="${me?.avatar || genAvatar('我')}" alt="">
        <span class="name">${esc(me?.name || '我')}</span>
      </button>
      <div class="grow"></div>
      <span class="brand">世界</span>
      <div class="grow"></div>
      <button class="icon-btn" data-act="new-chat" aria-label="新建">${icon('i-plus')}</button>
    </header>`;
  }
  if(v === 'contacts'){
    return `<header class="topbar">
      <div class="grow"><h1 class="topbar-title">联系人</h1><div class="topbar-sub">${friends.length} 位好友 · ${groupChats.length} 个群聊</div></div>
      <button class="icon-btn accent" data-act="contact-add" aria-label="添加">${icon('i-plus')}</button>
    </header>`;
  }
  if(v === 'settings'){
    return `<header class="topbar">
      <div class="grow"><h1 class="topbar-title">设置</h1><div class="topbar-sub">让「世界」更像你</div></div>
      <span class="chip gray">v1.0</span>
    </header>`;
  }
  if(v === 'me'){
    return `<header class="topbar">
      <div class="grow"><h1 class="topbar-title">我的</h1><div class="topbar-sub">只属于你的私人空间</div></div>
      ${icon('i-spark','lg')}
    </header>`;
  }
  const title = SUB_TITLES[v] || '世界';
  let action = '';
  if(v === 'library'){
    action = `<button class="btn tiny ${ui.libraryManage?'':'ghost'}" data-act="lib-manage">${ui.libraryManage?'完成':'管理'}</button>
      <button class="icon-btn accent" data-act="lib-add" aria-label="添加词条">${icon('i-plus')}</button>`;
  }else if(v === 'privateLib'){
    action = `<button class="btn tiny ${ui.plibManage?'':'ghost'}" data-act="plib-manage">${ui.plibManage?'完成':'管理'}</button>
      <button class="icon-btn accent" data-act="plib-add" aria-label="添加词条">${icon('i-plus')}</button>`;
  }else if(v === 'account'){
    action = `<button class="icon-btn accent" data-act="tx-add" aria-label="记一笔">${icon('i-plus')}</button>`;
  }else if(v === 'moments'){
    action = `<button class="icon-btn accent" data-act="moment-add" aria-label="发布">${icon('i-plus')}</button>`;
  }else if(v === 'diary'){
    action = `<button class="icon-btn accent" data-act="diary-add" aria-label="写日记">${icon('i-plus')}</button>`;
  }
  return `<header class="topbar">
    <button class="icon-btn back" data-act="back" aria-label="返回">${icon('i-back','lg')}</button>
    <div class="grow"><h1 class="topbar-title">${title}</h1></div>
    ${action}
  </header>`;
}

function renderMainContent(){
  switch(view.name){
    case 'messages': return renderMessagesPage();
    case 'contacts': return renderContactsPage();
    case 'settings': return renderSettingsPage();
    case 'me':       return renderMePage();
    case 'library':  return renderLibraryPage();
    case 'privateLib': return renderPrivateLibPage();
    case 'theme':    return renderThemePage();
    case 'chatSettings': return renderChatSettingsPage();
    case 'storage':  return renderStoragePage();
    case 'transfer': return renderTransferPage();
    case 'account':  return renderAccountPage();
    case 'moments':  return renderMomentsPage();
    case 'diary':    return renderDiaryPage();
    default: return `<div class="page"><div class="empty">${emptyArt()}<b>页面不存在</b><p>返回首页继续逛逛吧。</p></div></div>`;
  }
}

/* =========================================================
   消息页
   ========================================================= */
function sortedChats(){
  return chats.slice().sort((a,b) => {
    if((a.lastAt||0) !== (b.lastAt||0)) return (b.lastAt||0)-(a.lastAt||0);
    return (a.createdAt||0)-(b.createdAt||0);
  });
}
function filteredChats(){
  const q = ui.messagesFilter.trim().toLowerCase();
  const list = sortedChats();
  if(!q) return list;
  return list.filter(c => (c.name||'').toLowerCase().includes(q) || (c.lastMsg||'').toLowerCase().includes(q));
}
function renderMessagesPage(){
  const list = filteredChats();
  return `<div class="msg-page">
    <div class="msg-search">
      <div class="search">${icon('i-search')}<input type="search" placeholder="搜索会话" value="${esc(ui.messagesFilter)}" data-input="conv-search"></div>
    </div>
    <div id="convListWrap">${renderConvList(list)}</div>
  </div>`;
}
function renderConvList(list){
  if(!list.length){
    return `<div class="empty">${emptyArt()}<b>${ui.messagesFilter ? '没有找到相关会话' : '还没有会话'}</b><p>${ui.messagesFilter ? '换个关键词试试看。' : '点击右上角的「+」，添加一位朋友或发起群聊。'}</p></div>`;
  }
  return `<div class="conv-list">${list.map(c => {
    const g = c.kind === 'group' ? groupById(c.refId) : null;
    const typing = settings.features.typing && c.pendingReplyAt && Date.now() > c.pendingReplyAt - 4000;
    const preview = typing ? (c.kind==='group' ? '有人正在输入……' : '对方正在输入……') : (c.lastMsg || '开始聊天吧');
    return `<div class="conv" data-act="open-chat" data-id="${c.id}" role="button" tabindex="0">
      <div class="conv-avatar">
        <img class="avatar md" src="${c.avatar || genAvatar(c.name)}" alt="">
        ${c.kind==='friend' ? '<span class="status-dot"></span>' : ''}
      </div>
      <div class="conv-main">
        <div class="conv-top">
          <span class="conv-name">${esc(c.name)}</span>
          ${g ? `<span class="conv-count">${groupMemberCount(g)}人</span>` : ''}
          <span class="conv-time">${c.lastAt ? fmtFull(c.lastAt) : ''}</span>
        </div>
        <div class="conv-bottom">
          <span class="conv-preview ${typing?'typing':''}">${esc(preview)}</span>
          ${c.unread ? `<span class="badge">${c.unread > 99 ? '99+' : c.unread}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;
}
function refreshConvList(){
  const wrap = $('#convListWrap');
  if(wrap) wrap.innerHTML = renderConvList(filteredChats());
}

/* =========================================================
   联系人页
   ========================================================= */
function renderContactsPage(){
  const t = ui.contactsTab;
  return `<div class="contacts-page">
    <div class="contacts-sticky">
      <div class="seg">
        <button class="${t==='groups'?'on':''}" data-act="contacts-tab" data-tab="groups">分组</button>
        <button class="${t==='friends'?'on':''}" data-act="contacts-tab" data-tab="friends">好友</button>
        <button class="${t==='groupchats'?'on':''}" data-act="contacts-tab" data-tab="groupchats">群聊</button>
      </div>
    </div>
    <div class="contacts-body">${renderContactsBody()}</div>
  </div>`;
}
function renderContactsBody(){
  if(ui.contactsTab === 'groups') return renderFriendGroups();
  if(ui.contactsTab === 'friends') return renderFriendsList();
  return renderGroupChatsList();
}
function renderFriendGroups(){
  if(!friendGroups.length){
    return `<div class="empty">${emptyArt()}<b>还没有分组</b><p>创建分组，把朋友放进「好友」「亲人」或你自己定义的位置。</p></div>
      <div class="contact-tools"><button class="btn block" data-act="friendgroup-add">${icon('i-plus')} 新建分组</button></div>`;
  }
  return `<div class="list-card">${friendGroups.map(g => {
    const count = friends.filter(f => f.groupId === g.id).length;
    return `<div class="friend-row" data-act="friendgroup-menu" data-id="${g.id}" role="button" tabindex="0">
      <div class="icon-tile t2">${icon('i-folder')}</div>
      <div class="grow"><div class="friend-name">${esc(g.name)}</div><div class="friend-sub">${count} 位好友</div></div>
      <button class="more-btn" data-act="friendgroup-menu" data-id="${g.id}" aria-label="更多">${icon('i-more')}</button>
    </div>`;
  }).join('')}</div>
  <div class="contact-tools">
    <button class="btn ghost" data-act="friendgroup-add">${icon('i-plus')} 新建分组</button>
    <button class="btn" data-act="contact-add">${icon('i-user-plus')} 添加好友</button>
  </div>`;
}
function renderFriendsList(){
  if(!friends.length){
    return `<div class="empty">${emptyArt()}<b>还没有好友</b><p>添加好友后，就能在这里找到他们，也能一起建群。</p></div>
      <div class="contact-tools"><button class="btn block" data-act="contact-add">${icon('i-user-plus')} 添加好友</button></div>`;
  }
  const known = new Set(friendGroups.map(g=>g.id));
  const sections = friendGroups.map(g => [g, friends.filter(f => f.groupId === g.id)]).filter(([,arr]) => arr.length);
  const orphan = friends.filter(f => !known.has(f.groupId));
  if(orphan.length) sections.push([{id:'__orphan', name:'未分组'}, orphan]);
  return sections.map(([g, arr]) => `
    <div class="group-block">
      <div class="group-head"><span>${esc(g.name)}</span><span class="num">${arr.length}</span><span class="line"></span></div>
      <div class="list-card">${arr.map(f => `
        <div class="friend-row" data-act="friend-open" data-id="${f.id}" role="button" tabindex="0">
          <img class="avatar md" src="${f.avatar || genAvatar(f.name)}" alt="">
          <div class="grow">
            <div class="friend-name">${esc(f.name)}</div>
            <div class="friend-sub">${esc(f.signature || '点击查看资料')}</div>
          </div>
          ${icon('i-right','chev')}
        </div>`).join('')}</div>
    </div>`).join('') + `
    <div class="contact-tools">
      <button class="btn ghost" data-act="friendgroup-add">${icon('i-folder')} 新建分组</button>
      <button class="btn" data-act="contact-add">${icon('i-user-plus')} 添加好友</button>
    </div>`;
}
function renderGroupChatsList(){
  if(!groupChats.length){
    return `<div class="empty">${emptyArt()}<b>还没有群聊</b><p>从好友里选择几个人，给这个小圈子起个名字。</p></div>
      <div class="contact-tools"><button class="btn block" data-act="contact-add">${icon('i-group-plus')} 发起群聊</button></div>`;
  }
  return `<div class="list-card">${groupChats.map(g => {
    const members = groupMembers(g);
    const stack = members.slice(0,4).map(m => `<img src="${m.avatar || genAvatar(m.name)}" alt="">`).join('');
    return `<div class="friend-row" data-act="group-open" data-id="${g.id}" role="button" tabindex="0">
      <img class="avatar md" src="${g.avatar || genAvatar(g.name)}" alt="">
      <div class="grow">
        <div class="friend-name">${esc(g.name)} <span class="chip gray">${groupMemberCount(g)}人</span></div>
        <div class="friend-sub"><span class="member-stack">${stack}</span><span>含我在内 ${groupMemberCount(g)} 人</span></div>
      </div>
      ${icon('i-right','chev')}
    </div>`;
  }).join('')}</div>
  <div class="contact-tools">
    <button class="btn ghost" data-act="contact-add">${icon('i-group-plus')} 发起群聊</button>
  </div>`;
}

   联系人：新建 / 编辑

function openContactAdd(){
  if(ui.contactsTab === 'groups') return openFriendGroupForm();
  if(ui.contactsTab === 'friends') return openFriendForm();
  return openGroupForm();
}

function openNewMenu(){
  openSheet({
    title:'新建',
    body:`<div class="menu-list">
      <button class="menu-item" data-new="friend">
        <span class="icon-tile">${icon('i-user-plus')}</span>
        <span class="grow"><span style="display:block">添加联系人</span><span class="sub">把朋友请进「世界」</span></span>
        ${icon('i-right','chev')}
      </button>
      <button class="menu-item" data-new="group">
        <span class="icon-tile t4">${icon('i-group-plus')}</span>
        <span class="grow"><span style="display:block">发起群聊</span><span class="sub">从好友里选择成员</span></span>
        ${icon('i-right','chev')}
      </button>
      <button class="menu-item" data-new="friendgroup">
        <span class="icon-tile t2">${icon('i-folder')}</span>
        <span class="grow"><span style="display:block">新建分组</span><span class="sub">给好友一个归属</span></span>
        ${icon('i-right','chev')}
      </button>
    </div>`,
    onMount(el, close){
      el.querySelectorAll('[data-new]').forEach(btn => btn.onclick = () => {
        const type = btn.dataset.new;
        close();
        setTimeout(() => {
          if(type === 'friend') openFriendForm();
          else if(type === 'group') openGroupForm();
          else openFriendGroupForm();
        }, 60);
      });
    }
  });
}

function openFriendForm(friend=null){
  const isEdit = !!friend;
  let avatar = friend?.avatar || genAvatar('新朋友', Math.floor(Math.random()*360));
  let hue = Math.floor(Math.random()*360);
  if(!friendGroups.length){
    return toast('请先创建一个好友分组');
  }
  const options = friendGroups.map(g => `<option value="${g.id}" ${friend && friend.groupId===g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('');
  openSheet({
    title: isEdit ? '编辑好友' : '添加好友',
    body:`<div class="avatar-edit">
        <img class="avatar xl" id="ffAvatar" src="${avatar}" alt="">
        <div class="meta">
          <b>头像</b><span>随机生成一个渐变头像，或上传本地图片。</span>
          <div class="actions">
            <button class="btn tiny ghost" id="ffRandom">${icon('i-swap')} 换一个</button>
            <button class="btn tiny soft" id="ffUpload">${icon('i-camera')} 上传</button>
          </div>
          <input type="file" id="ffFile" accept="image/*" hidden>
        </div>
      </div>
      <div class="field"><label>昵称</label><input class="input" id="ffName" maxlength="24" value="${esc(friend?.name || '')}" placeholder="输入好友昵称"></div>
      <div class="field"><label>签名（可选）</label><input class="input" id="ffSign" maxlength="40" value="${esc(friend?.signature || '')}" placeholder="一句话介绍"></div>
      <div class="field"><label>所属分组</label><select class="select" id="ffGroup">${options}</select></div>
      <p class="form-note">保存后，好友会自动出现在「消息」列表中，随时可以开始聊天。</p>`,
    footer:`<button class="btn soft" data-close>取消</button><button class="btn" id="ffSave">保存</button>`,
    onMount(el, close){
      const img = el.querySelector('#ffAvatar');
      const nameInput = el.querySelector('#ffName');
      el.querySelector('#ffRandom').onclick = () => {
        hue = Math.floor(Math.random()*360);
        avatar = genAvatar(nameInput.value || '新朋友', hue);
        img.src = avatar;
      };
      el.querySelector('#ffUpload').onclick = () => el.querySelector('#ffFile').click();
      el.querySelector('#ffFile').onchange = async e => {
        const file = e.target.files[0];
        if(!file) return;
        try{
          avatar = await readImageFile(file, 320);
          img.src = avatar;
        }catch(err){ toast('图片读取失败'); }
      };
      el.querySelector('#ffSave').onclick = async () => {
        const name = nameInput.value.trim();
        if(!name) return toast('请填写好友昵称');
        const signature = el.querySelector('#ffSign').value.trim();
        const groupId = el.querySelector('#ffGroup').value;
        const friendId = friend?.id || 'fr_'+uid();
        const rec = Object.assign({}, friend || {}, {
          id:friendId, name, avatar, groupId, signature, createdAt:friend?.createdAt || Date.now()
        });
        await dbPut('friends', rec);
        const li = friends.findIndex(f => f.id === friendId);
        if(li >= 0) friends[li] = rec; else friends.push(rec);
        let chat = chats.find(c => c.kind === 'friend' && c.refId === friendId);
        if(!chat){
          chat = makeChatForFriend(rec);
          await dbPut('chats', chat);
          chats.push(chat);
        }else{
          chat.name = name; chat.avatar = avatar;
          await dbPut('chats', chat);
        }
        close();
        toast(isEdit ? '好友资料已更新' : '好友已添加');
        render();
      };
    }
  });
}

function openGroupForm(group=null){
  const isEdit = !!group;
  if(!friends.length){
    toast('请先添加好友，再发起群聊');
    return;
  }
  let avatar = group?.avatar || genAvatar('群聊', Math.floor(Math.random()*360));
  let hue = Math.floor(Math.random()*360);
  let members = new Set(group?.memberIds || []);
  openSheet({
    title: isEdit ? '编辑群聊' : '发起群聊',
    body:`<div class="avatar-edit">
        <img class="avatar xl" id="gfAvatar" src="${avatar}" alt="">
        <div class="meta">
          <b>群聊头像</b><span>群聊人数包含你自己，当前为 <b id="gfCount">${members.size+1}</b> 人。</span>
          <div class="actions">
            <button class="btn tiny ghost" id="gfRandom">${icon('i-swap')} 换一个</button>
            <button class="btn tiny soft" id="gfUpload">${icon('i-camera')} 上传</button>
          </div>
          <input type="file" id="gfFile" accept="image/*" hidden>
        </div>
      </div>
      <div class="field"><label>群聊名称</label><input class="input" id="gfName" maxlength="24" value="${esc(group?.name || '')}" placeholder="给群聊起个名字"></div>
      <div class="field"><label>选择好友</label>
        <div class="check-list">${friends.map(f => `
          <label class="check-item">
            <input type="checkbox" value="${f.id}" ${members.has(f.id)?'checked':''}>
            <img src="${f.avatar || genAvatar(f.name)}" alt="">
            <span class="nm">${esc(f.name)}</span>
            <span class="grp">${esc(friendGroups.find(g=>g.id===f.groupId)?.name || '')}</span>
          </label>`).join('')}</div>
      </div>
      <p class="form-note">群聊人数 = 选中好友 + 你。未选中任何好友时无法创建群聊。</p>`,
    footer:`<button class="btn soft" data-close>取消</button><button class="btn" id="gfSave">保存</button>`,
    onMount(el, close){
      const img = el.querySelector('#gfAvatar');
      const countEl = el.querySelector('#gfCount');
      el.querySelectorAll('.check-item input').forEach(cb => {
        cb.onchange = () => {
          members = new Set(Array.from(el.querySelectorAll('.check-item input:checked')).map(x=>x.value));
          countEl.textContent = members.size + 1;
        };
      });
      el.querySelector('#gfRandom').onclick = () => {
        hue = Math.floor(Math.random()*360);
        avatar = genAvatar(el.querySelector('#gfName').value || '群聊', hue);
        img.src = avatar;
      };
      el.querySelector('#gfUpload').onclick = () => el.querySelector('#gfFile').click();
      el.querySelector('#gfFile').onchange = async e => {
        const file = e.target.files[0];
        if(!file) return;
        try{ avatar = await readImageFile(file, 320); img.src = avatar; }
        catch(err){ toast('图片读取失败'); }
      };
      el.querySelector('#gfSave').onclick = async () => {
        const name = el.querySelector('#gfName').value.trim();
        if(!name) return toast('请填写群聊名称');
        if(!members.size) return toast('至少选择一位好友');
        const groupId = group?.id || 'gchat_'+uid();

const STATUS_TTL_MIN = [5, 15];
function nextStatusAt(){
  const [lo, hi] = STATUS_TTL_MIN;
  return Date.now() + (lo + Math.random() * (hi - lo)) * 60000;
}
function syncStatusDom(fm){
  const menu = document.querySelector('.friend-menu[data-friend]');
  if(!menu || menu.dataset.friend !== fm.id) return;
  menu.querySelectorAll('[data-fstat]').forEach(el => {
    const k = el.dataset.fstat;
    if(fm.status[k]) el.textContent = fm.status[k];
  });
}
function randomStatusText(friendId, kind){
  const type = kind === 'mood' ? 'mood' : kind === 'weather' ? 'weather' : 'status';
  const pool = friendLibPool(friendId, [type]).map(x=>x.content).filter(Boolean);
  return pool.length ? pick(pool) : '';
}
function rollFriendStatus(fm, force){
  const s = fm.status;
  if(!s) return false;
  const kinds = ['mood','state','weather'];
  if(!kinds.some(k => libTextPool(fm.id, [k]).length)) return false;
  const now = Date.now();
  if(!force && s.nextAt && now < s.nextAt) return false;
  let changed = false;
  kinds.forEach(k => {
    const v = randomStatusText(fm.id, k);
    if(v && v !== s[k]){ s[k] = v; changed = true; }
  });
  const custom = Number(fm.settings && fm.settings.status && fm.settings.status.every) || 0;
  if(custom > 0){
    s.nextAt = Date.now() + custom * (0.5 + Math.random()) * 60000;
  }else{
    s.nextAt = nextStatusAt();
  }
  return changed;
}
function frameClass(which, friendId){
  const fm = friendMetaOf(friendId);
  const key = which === 'me' ? fm.chatTheme.myFrame : fm.chatTheme.otherFrame;
  return (!key || key === 'none') ? 'avatar' : 'avatar frame-' + key;
}

async function deleteMessagesOfChat(chatId){
  const list = await getMessages(chatId, true);
  for(const m of list) await dbDelete('messages', m.id);
  invalidateMessages(chatId);
}
async function deleteFriend(id){
  const chat = chats.find(c => c.kind === 'friend' && c.refId === id);
  if(chat){
    await deleteMessagesOfChat(chat.id);
    await dbDelete('chats', chat.id);
    chats = chats.filter(c => c.id !== chat.id);
  }
  for(const g of groupChats.slice()){
    if(g.memberIds.includes(id)){
      g.memberIds = g.memberIds.filter(x => x !== id);
      await dbPut('groupChats', g);
    }
  }
  await dbDelete('friends', id);
  friends = friends.filter(f => f.id !== id);
  toast('好友已删除');
}
async function deleteGroupChat(id){
  const group = groupById(id);
  const chat = chats.find(c => c.kind === 'group' && c.refId === id);
  if(chat){
    await deleteMessagesOfChat(chat.id);
    await dbDelete('chats', chat.id);
    chats = chats.filter(c => c.id !== chat.id);
  }
  await dbDelete('groupChats', id);
  groupChats = groupChats.filter(g => g.id !== id);
  if(group) toast('群聊已解散');
}

          for(const file of files){
            try{
              const data = await readImageFile(file, 320);
              const rec = {id:'lib_'+uid(), type:'sticker', content:data, label:'导入', at:Date.now()};
              await dbPut('library', rec); library.push(rec); added++;
            }catch(e){ /* 跳过无法读取的文件 */ }
          }
        }else{
          const lines = el.querySelector('#laText').value.split('\n').map(s=>s.trim()).filter(Boolean);
          if(!lines.length) return toast('请至少输入一条内容');
          const now = Date.now();
          for(const content of lines){
            const rec = {id:'lib_'+uid(), type:activeType, content, label:'', at:now};
            await dbPut('library', rec); library.push(rec); added++;
          }
        }
        ui.libraryTab = activeType;
        ui.librarySel.clear();
        close();
        toast(`已添加 ${added} 条词条`);
        render();
      };
    }
  });
}

async function refreshStorage(){
  const usedEl = $('#storageUsed');
  if(!usedEl) return;
  let usage = 0, quota = 0;
  try{
    if(navigator.storage && navigator.storage.estimate){
      const est = await navigator.storage.estimate();
      usage = est.usage || 0;
      quota = est.quota || 0;
    }
  }catch(e){}
  const pct = quota ? Math.min(100, (usage / quota) * 100) : 0;
  usedEl.textContent = quota ? `已用 ${fmtBytes(usage)}` : '浏览器未提供容量信息';
  const bar = $('#storageBar');
  if(bar) bar.style.width = Math.max(0.6, pct) + '%';
  const quotaEl = $('#storageQuota');
  if(quotaEl) quotaEl.textContent = quota ? `可用配额约 ${fmtBytes(quota)}` : '可用配额 —';
  const pctEl = $('#storagePct');
  if(pctEl) pctEl.textContent = quota ? `${pct.toFixed(2)}%` : '—';
  try{
    const [msgs, chatCount, libCount] = await Promise.all([dbCount('messages'), dbCount('chats'), dbCount('library')]);
    const m = $('#statMsgs'), c = $('#statChats'), l = $('#statLib');
    if(m) m.textContent = msgs;
    if(c) c.textContent = chatCount;
    if(l) l.textContent = libCount;
  }catch(e){}
}
async function clearChatData(){
  const ok = await confirmDialog({title:'清除聊天数据', message:'将清空所有会话的消息记录与未读状态，好友和群聊会保留。此操作不可撤销。', danger:true, confirmText:'清除'});
  if(!ok) return;
  await dbClear('messages');

    c.unread = 0; c.lastMsg = ''; c.lastAt = 0; c.pendingReplyAt = 0;
    await dbPut('chats', c);

async function clearAllData(){
  const ok = await confirmDialog({title:'清除所有数据', message:'所有好友、群聊、消息、朋友圈、日记、账户与设置都会消失，并恢复到初始状态。此操作不可撤销。', danger:true, confirmText:'全部清除'});

  try{ if(db){ db.close(); db = null; } }catch(e){}
  const req = indexedDB.deleteDatabase(DB_NAME);

}

async function buildReadableText(){

  const lines = [];
  lines.push('# 世界 · 可读数据备份');
  lines.push('');
  lines.push(`- 导出时间：${fmtFull(Date.now())}`);
  lines.push(`- 应用版本：v1.0 / DB v${DB_VERSION}`);
  lines.push('');
  lines.push('## 个人资料');
  lines.push(`- 昵称：${me?.name || '我'}`);
  lines.push(`- 标签：${(me?.tags || []).join('、') || '无'}`);
  lines.push(`- 心情：${me?.mood || '未设置'}`);
  lines.push(`- 天气：${me?.weather || '未设置'}`);
  lines.push(`- 余额：¥${Number(me?.balance || 0).toFixed(2)}`);
  lines.push('');
  lines.push('## 好友分组');
  friendGroups.forEach(g => lines.push(`- ${g.name}（${friends.filter(f=>f.groupId===g.id).length} 人）`));
  lines.push('');
  lines.push('## 好友');
  friends.forEach(f => lines.push(`- ${f.name} · ${friendGroups.find(g=>g.id===f.groupId)?.name || '未分组'}${f.signature ? ' · ' + f.signature : ''}`));
  lines.push('');
  lines.push('## 群聊');
  groupChats.forEach(g => {
    const names = groupMembers(g).map(m=>m.name).join('、');
    lines.push(`- ${g.name}（${groupMemberCount(g)} 人，含我）：${names}`);
  });
  lines.push('');
  lines.push('## 聊天记录');
  for(const c of chats.slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))){
    lines.push('');
    lines.push(`### ${c.name}${c.kind==='group' ? `（群聊 · ${groupMemberCount(groupById(c.refId)||{memberIds:[]})} 人）` : ''}`);
    const list = allMessages.filter(m => m.chatId === c.id);
    if(!list.length){ lines.push('（暂无消息）'); continue; }
    for(const m of list){
      const who = m.sender === 'me' ? (me?.name || '我') : (friendById(m.sender)?.name || '未知成员');
      let content = m.content || '';
      if(m.type === 'sticker') content = '[表情包]';
      if(m.type === 'quote' && m.quote) content = `[引用 ${m.quote.name}] ${content}`;
      lines.push(`- ${fmtFull(m.at)} · ${who}：${content}`);
    }
  }
  lines.push('');
  lines.push('## 公共词条库');
  for(const type of LIB_ORDER){
    const items = library.filter(x => x.type === type);
    lines.push('');
    lines.push(`### ${LIB_TYPES[type].label}（${items.length}）`);
    if(!items.length){ lines.push('（空）'); continue; }
    lines.push(items.map(x => x.type === 'sticker' ? '[表情包]' : x.content).join('、'));
  }
  lines.push('');
  lines.push('## 朋友圈');
  if(!moments.length) lines.push('（空）');
  moments.forEach(m => {
    lines.push(`- ${fmtFull(m.at)}：${m.text}`);
    if(m.likes && m.likes.length) lines.push(`  - 点赞：${m.likes.map(id=>id==='me'?me?.name||'我':friendById(id)?.name||'朋友').join('、')}`);
    (m.comments || []).forEach(cm => lines.push(`  - 评论 · ${cm.name}：${cm.text}`));
  });
  lines.push('');
  lines.push('## 日记');
  if(!diaries.length) lines.push('（空）');
  diaries.forEach(d => {
    lines.push(`- ${fmtFull(d.at)}${d.title ? ' · ' + d.title : ''}`);
    lines.push(`  ${d.text.replace(/\n/g, '\n  ')}`);
    (d.comments || []).forEach(cm => lines.push(`  - ${cm.name}：${cm.text}`));
  });
  lines.push('');
  lines.push('## 账户');
  lines.push(`- 当前余额：¥${Number(me?.balance || 0).toFixed(2)}`);
  lines.push(`- 累计收入：¥${ledger.filter(x=>x.type==='in').reduce((s,x)=>s+Number(x.amount||0),0).toFixed(2)}`);
  lines.push(`- 累计支出：¥${ledger.filter(x=>x.type==='out').reduce((s,x)=>s+Number(x.amount||0),0).toFixed(2)}`);
  ledger.forEach(t => lines.push(`- ${fmtFull(t.at)} · ${t.type==='in'?'收入':'支出'} ¥${Number(t.amount||0).toFixed(2)}${t.note ? ' · ' + t.note : ''}`));
  lines.push('');
  lines.push('## 设置');
  lines.push('```json');
  lines.push(JSON.stringify({theme:settings.theme, features:settings.features, pace:settings.pace, display:settings.display}, null, 2));
  lines.push('```');
  lines.push('');
  return lines.join('\n');
}

async function handleImportFile(file){
  try{
    const text = await file.text();
    const obj = JSON.parse(text);
    if(!obj || obj.app !== '世界' || !obj.stores || typeof obj.stores !== 'object'){
      throw new Error('这不是「世界」导出的备份文件');
    }
    const ok = await confirmDialog({
      title:'导入数据',
      message:'导入会覆盖当前设备上的全部数据。建议先导出一份当前数据再继续。确定导入吗？',
      danger:true, confirmText:'覆盖并导入'
    });
    if(!ok) return;
    toast('正在导入…');
    const d = await openDB();
    const existing = Array.from(d.objectStoreNames);
    for(const name of existing) await dbClear(name);
    for(const [name, records] of Object.entries(obj.stores)){
      if(!Array.isArray(records)) continue;
      if(existing.includes(name)){
        if(records.length) await dbBulkPut(name, records);
      }else{
        await dbPut('_extra', {key:'store:'+name, value:records});
      }
    }
    toast('导入完成，正在刷新…');
    setTimeout(() => location.reload(), 700);
  }catch(e){
    toast('导入失败：' + e.message);
  }
}

function bindLibSearch(){
  document.querySelectorAll('[data-lib-search]').forEach(inp => {
    if(inp.dataset.bound) return;
    inp.dataset.bound = '1';
    const body = inp.closest('.lib-body');
    const grid = body && body.querySelector('.lib-grid');
    if(!grid) return;
    const apply = () => {
      const q = inp.value.trim().toLowerCase();
      let n = 0;
      grid.querySelectorAll('.lib-item').forEach(el => {
        const hit = !q || (el.dataset.k || '').toLowerCase().includes(q);
        el.style.display = hit ? '' : 'none';
        if(hit) n++;
      });
      const noHit = grid.querySelector('.lib-no-hit');
      if(noHit) noHit.hidden = !(q && n === 0);
      const empty = grid.querySelector('.lib-empty:not(.lib-no-hit)');
      if(empty) empty.style.display = q ? 'none' : '';
    };
    inp.addEventListener('input', apply);
  });
}
let libSwipeStart = null;
function bindLibrarySwipe(){
  const body = $('#libBody');
  if(!body) return;
  body.addEventListener('touchstart', e => {
    const t = e.touches[0];
    libSwipeStart = {x:t.clientX, y:t.clientY};
  }, {passive:true});
  body.addEventListener('touchend', e => {
    if(!libSwipeStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - libSwipeStart.x;
    const dy = t.clientY - libSwipeStart.y;
    libSwipeStart = null;
    if(Math.abs(dx) < 55 || Math.abs(dy) > 45) return;
    const idx = LIB_ORDER.indexOf(ui.libraryTab);
    const next = dx < 0 ? Math.min(LIB_ORDER.length-1, idx+1) : Math.max(0, idx-1);
    if(next !== idx){
      ui.libraryTab = LIB_ORDER[next];
      ui.librarySel.clear();
      render();
      scrollLibTabsToActive();
    }
  }, {passive:true});
}

    const th = friendMetaOf(chat.refId).chatTheme;
    const fkey = mine ? th.myFrame : th.otherFrame;
    if(fkey && fkey !== 'none') avCls += ' frame-' + fkey;
  }
  const quote = m.quote ? `<div class="quote-line"><b>${esc(m.quote.name)}</b> ${esc(m.quote.text)}</div>` : '';
  let content = '';
  let bubbleCls = 'bubble';
  if(m.type === 'sticker'){
    bubbleCls = 'bubble sticker';
    content = `<img src="${m.content}" alt="表情包" draggable="false">`;
  }else if(m.type === 'image'){
    bubbleCls = 'bubble image';
    content = `<img src="${m.content}" alt="图片" draggable="false" data-act="view-image" data-msg="${m.id}">`;
  }else if(m.type === 'emoji'){
    bubbleCls = 'bubble emoji';
    content = esc(m.content);
  }else if(m.type === 'kaomoji'){
    bubbleCls = 'bubble kaomoji';
    content = esc(m.content);
  }else if(m.type === 'card'){
    bubbleCls = 'bubble card';
    content = esc(m.content);
  }else if(m.type === 'status'){
    bubbleCls = 'bubble status';
    content = '状态 · ' + esc(m.content);
  }else if(m.type === 'poll'){
    bubbleCls = 'bubble poll';
    const p = polls.find(x => x.id === m.pollId);
    content = p ? pollBubbleHTML(p, chat) : '<div class="poll-body"><div class="poll-q">投票已失效</div></div>';
  }else if(m.type === 'survey'){
    bubbleCls = 'bubble survey';

    content = q ? surveyBubbleHTML(q, chat) : '<div class="survey-body"><div class="survey-title">问卷已失效</div></div>';
  }else if(m.type === 'letter-msg'){
    bubbleCls = 'bubble letter-msg';

  }else{

  if(cfg.features.read && mine) metaBits.push(`<span class="read ${m.read?'done':''}">${m.read?'已读':'未读'}</span>`);

    }
    top = Math.max(8, Math.min(vh - h - 8, top));
  }else{
    left = vw / 2 - w / 2; top = vh / 2 - h / 2;
  }
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  const outside = ev => { if(!pop.contains(ev.target)) close(); };
  const close = () => { document.removeEventListener('pointerdown', outside, true); closeMsgMenu(); };
  setTimeout(() => document.addEventListener('pointerdown', outside, true), 0);
  const rb = pop.querySelector('[data-r]');
  const db = pop.querySelector('[data-d]');
  let fired = false;
  const run = async kind => {
    if(fired) return;
    fired = true;
    close();
    if(kind === 'recall') await recallMessage(chat, msgId);
    else await deleteMessage(chat, msgId);
  };
  const bind = (btn, kind) => {
    if(!btn) return;
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      e.stopPropagation();
      run(kind);
    });
    btn.addEventListener('click', e => {
      e.preventDefault();
      run(kind);
    });
  };
  bind(rb, 'recall');
  bind(db, 'delete');
}

let msgPressTimer = null, msgPressStart = null, msgLongPressedAt = 0, lastRecallCheck = 0;
function bindMsgActions(){
  document.addEventListener('dragstart', e => {
    if(e.target.closest && e.target.closest('.bubble img')) e.preventDefault();
  });
  document.addEventListener('pointerdown', e => {
    if(view.name !== 'chat' || (e.button !== undefined && e.button !== 0)) return;
    const bubble = e.target.closest('.bubble');
    if(!bubble) return;
    const msgEl = bubble.closest('.msg');
    if(!msgEl) return;
    msgPressStart = { x:e.clientX, y:e.clientY, id:msgEl.dataset.msgid };
    clearTimeout(msgPressTimer);
    msgPressTimer = setTimeout(() => {
      if(!msgPressStart) return;
      msgLongPressedAt = Date.now();
      if(navigator.vibrate) navigator.vibrate(12);
      openMsgActions(msgPressStart.id);
    }, 520);
  });
  document.addEventListener('pointermove', e => {
    if(!msgPressStart) return;
    if(Math.hypot(e.clientX - msgPressStart.x, e.clientY - msgPressStart.y) > 8){
      clearTimeout(msgPressTimer);
      msgPressStart = null;
    }
  });
  ['pointerup','pointercancel'].forEach(ev => document.addEventListener(ev, () => {
    clearTimeout(msgPressTimer);
    msgPressStart = null;
  }));
  document.addEventListener('contextmenu', e => {
    if(view.name !== 'chat') return;
    const bubble = e.target.closest('.bubble');
    if(!bubble) return;
    const msgEl = bubble.closest('.msg');
    if(!msgEl) return;
    e.preventDefault();
    openMsgActions(msgEl.dataset.msgid);
  });
}

async function maybeRandomRecall(now){
  if(now - lastRecallCheck < 20000) return;
  lastRecallCheck = now;
  if(Math.random() > 0.18) return;
  const pool = chats.filter(c => c.kind === 'friend').sort(() => Math.random() - 0.5);
  for(const chat of pool){
    const list = await getMessages(chat.id);
    const lastId = list.length ? list[list.length - 1].id : null;
    const candidates = list.filter(m =>
      m.sender !== 'me' && !m.recalled &&
      ['text','sticker','emoji','kaomoji','image','card'].includes(m.type) &&
      now - (m.at || 0) > 60000 && now - (m.at || 0) < 30 * 60 * 1000 &&
      m.id !== lastId
    );
    if(!candidates.length) continue;
    const m = candidates[Math.floor(Math.random() * candidates.length)];
    m.recalled = true;
    m.recalledAt = now;
    await dbPut('messages', m);
    invalidateMessages(chat.id);
    if(view.name === 'chat' && view.id === chat.id) await refreshChat();
    await refreshChatPreview(chat);
    return;
  }
}

async function sendChatMessage(chat, payload){
  const msg = {

    content:payload.content, at:Date.now(), read:false
  };
  if(payload.label) msg.label = payload.label;

  if(quoteTarget) msg.quote = {name:quoteTarget.name, text:quoteTarget.text};
  await dbPut('messages', msg);
  invalidateMessages(chat.id);
  chat.lastMsg = msgPreview(chat, msg);
  chat.lastAt = msg.at;
  chat.unread = 0;
  await saveChat(chat);
  await scheduleReply(chat);
  quoteTarget = null;
  renderQuoteBar();
  await refreshChat(true);
  if(view.name === 'messages') refreshConvList();

async function scheduleReply(chat){
  if(chat.pendingReplyAt) return;
  const cfg = chatCfg(chat);
  const a = Math.max(1, Math.min(3600, Number(cfg.pace.delayMin) || 30));
  const b = Math.max(a, Math.min(3600, Number(cfg.pace.delayMax) || a));
  const sec = a + Math.random() * (b - a);
  chat.pendingReplyAt = Date.now() + Math.round(sec) * 1000;
  await saveChat(chat);
}

/* ---------- 自动回复与主动消息 ---------- */
function replySenderId(chat){
  if(chat.kind === 'friend') return chat.refId;
  const g = groupById(chat.refId);
  return g && g.memberIds.length ? pick(g.memberIds) : null;
}
function replyPool(chat){
  const types = ['card','kaomoji','emoji','sticker'];
  const base = library.filter(x => types.includes(x.type) && !x.disabled);
  if(!chat || chat.kind !== 'friend') return base;
  return base.concat(privateLibrary.filter(x => x.friendId === chat.refId && x.owner === 'friend' && types.includes(x.type) && !x.disabled));
}
async function receiveFriendMessage(chat, senderId, item){
  const msg = {
    id:'msg_'+uid(), chatId:chat.id, sender:senderId || 'unknown',
    type:item.type, content:item.content, at:Date.now(), read:true
  };
  if(item.label) msg.label = item.label;
  await dbPut('messages', msg);
  invalidateMessages(chat.id);
  chat.lastMsg = msgPreview(chat, msg);
  chat.lastAt = msg.at;
  const isOpen = view.name === 'chat' && view.id === chat.id;
  chat.unread = isOpen ? 0 : (chat.unread || 0) + 1;
  playMessageSound(isOpen);
  await saveChat(chat);
  if(isOpen) await refreshChat(false);
  else if(view.name === 'messages') refreshConvList();
  return msg;
}
async function deliverAutoReply(chat){
  if(replyLocks.has(chat.id)) return;
  replyLocks.add(chat.id);
  try{
    const cfg = chatCfg(chat);
    const pool = replyPool(chat);
    const count = Math.min(10, Math.max(1, Number(cfg.pace.count) || 1));
    for(let i=0;i<count;i++){
      if(!chatById(chat.id)) return;
      const item = pick(pool);
      if(!item) return;
      await receiveFriendMessage(chat, replySenderId(chat), item);
      if(i < count-1) await sleep(680);
    }
    const changed = await markMyMessagesRead(chat.id);
    if(changed) await refreshChat(false);
    if(view.name === 'messages') refreshConvList();
  }finally{
    replyLocks.delete(chat.id);
  }
}
async function deliverSpontaneous(chat){
  if(replyLocks.has(chat.id)) return;
  replyLocks.add(chat.id);
  try{
    if(!chatById(chat.id)) return;
    const cfg = chatCfg(chat);
    const pool = replyPool(chat);
    if(!pool.length) return;
    const a = Math.max(1, Math.min(10, Number(cfg.pace.autoMin) || 1));
    const b = Math.max(a, Math.min(10, Number(cfg.pace.autoMax) || a));
    const count = a + Math.floor(Math.random() * (b - a + 1));
    for(let i=0;i<count;i++){
      const item = pick(pool);
      if(!item) return;
      await receiveFriendMessage(chat, replySenderId(chat), item);
      if(i < count-1) await sleep(680);
    }
    const changed = await markMyMessagesRead(chat.id);
    if(changed) await refreshChat(false);
  }finally{
    replyLocks.delete(chat.id);
  }
}
function maybeAutoSend(){
  if(!settings.pace.autoSend) return;
  if(Date.now() - lastAutoSend < 30000) return;
  lastAutoSend = Date.now();
  if(Math.random() > 0.32) return;
  const candidates = chats.filter(c => !c.pendingReplyAt);
  if(!candidates.length) return;
  deliverSpontaneous(pick(candidates));
}
function updateTypingIndicators(){
  if(!settings) return;
  if(view.name === 'chat'){
    const chat = chatById(view.id);
    if(chat) updateChatSub(chat);
  }
  const key = chats
    .filter(c => settings.features.typing && c.pendingReplyAt && Date.now() > c.pendingReplyAt - 4000)
    .map(c => c.id).sort().join(',');
  if(view.name === 'messages' && key !== lastTypingKey){
    lastTypingKey = key;
    refreshConvList();
  }
}
async function chatTick(){
  if(!booted || tickBusy) return;
  tickBusy = true;
  try{
    const now = Date.now();
    for(const chat of chats.slice()){
      if(chat.pendingReplyAt && now >= chat.pendingReplyAt && !replyLocks.has(chat.id)){
        chat.pendingReplyAt = 0;
        await saveChat(chat);
        deliverAutoReply(chat);
      }
    }
    await processTimedFeatures(now);
    await maybeRandomRecall(now);
    updateTypingIndicators();
    maybeAutoSend();
  }finally{
    tickBusy = false;
  }
}

function makeMiniDraggable(el, call){
  let sx = 0, sy = 0, ox = 0, oy = 0, dragging = false;
  el.addEventListener('pointerdown', e => {
    if(e.target.closest('.end') || e.target.closest('.bg')) return;
    const r = el.getBoundingClientRect();
    dragging = true;
    el.dataset.moved = '';
    sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
    el.style.right = 'auto';
    el.style.bottom = 'auto';
    el.style.left = r.left + 'px';
    el.style.top = r.top + 'px';
    el.classList.add('dragging');
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });
  el.addEventListener('pointermove', e => {
    if(!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.abs(dx) > 4 || Math.abs(dy) > 4) el.dataset.moved = '1';
    const w = el.offsetWidth, h = el.offsetHeight;
    const nx = Math.max(6, Math.min(window.innerWidth - w - 6, ox + dx));
    const ny = Math.max(6, Math.min(window.innerHeight - h - 6, oy + dy));
    el.style.left = nx + 'px';
    el.style.top = ny + 'px';
    e.preventDefault();
  });
  const end = e => {
    if(!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    try{ el.releasePointerCapture(e.pointerId); }catch(_){}
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
function minimizeCall(call){
  if(!call || call.miniEl) return;
  const chat = call.chat;
  const el = document.createElement('div');
  el.className = 'mini-call';
  el.innerHTML = `<img src="${chat.avatar || genAvatar(chat.name)}" alt="">
    <div class="grow"><div class="nm">${esc(chat.name)}</div><div class="tm">通话中 · 00:00</div></div>

    <button class="end" aria-label="挂断">${icon('i-hangup')}</button>`;
  el.querySelector('.bg').onclick = e => {
    e.stopPropagation();
    openCallBgPicker(call.wrap);
  };
  el.querySelector('.end').onclick = e => {
    e.stopPropagation();
    if(typeof call.onEnd === 'function') call.onEnd();

  el.onclick = () => {
    if(el.dataset.moved === '1'){ el.dataset.moved = ''; return; }
    el.remove();

  };
  makeMiniDraggable(el, call);

}

      timers.push(setTimeout(() => finish('noanswer'), 8000));

        if(!question) return toast('请填写投票问题');
        if(options.length < 2) return toast('至少需要两个选项');
        const minS = Math.max(0, Math.floor(Number(el.querySelector('#pollMin').value) || 0));
        const maxM = Math.floor(Number(el.querySelector('#pollMax').value) || 0);
        if(maxM < 1) return toast('最慢时间至少 1 分钟');
        if(maxM > 1440) return toast('最慢时间最多 24 小时');
        const maxS = maxM * 60;
        if(minS >= maxS) return toast('最快时间需要小于最慢时间');
        const now = Date.now();
        const poll = {
          id:'poll_'+uid(), chatId:chat.id, friendId:chat.refId, creator:'me',
          question, options, multi, votes:{me:[], friend:[]},
          createdAt:now, deadline:now + maxS*1000, status:'open',
          minDelay:minS, maxDelay:maxM,
          friendVoteAt:now + (minS + Math.random()*(maxS-minS))*1000
        };
        polls.unshift(poll);
        await dbPut('polls', poll);
        close();
        await sendChatMessage(chat, {type:'poll', pollId:poll.id, content:'投票'});
        toast(`投票已发出 · 最慢 ${maxM} 分钟内回收`);
      };
    }
  });
}
function pollCountdown(deadline){
  const left = Math.max(0, deadline - Date.now());
  const h = Math.floor(left/3600000), m = Math.floor(left%3600000/60000), s = Math.floor(left%60000/1000);
  return h > 0 ? `${h}:${pad2(m)}:${pad2(s)}` : `${pad2(m)}:${pad2(s)}`;
}
function pollBubbleHTML(p){
  const now = Date.now();
  const my = (p.votes && p.votes.me) || [];
  const fr = (p.votes && p.votes.friend) || [];
  const closed = p.status !== 'open' || now > p.deadline;
  const revealed = closed || (my.length > 0 && fr.length > 0);
  const voters = (my.length ? 1 : 0) + (fr.length ? 1 : 0);
  const opts = p.options.map((o,i) => {
    const selected = my.includes(i);
    const cnt = (my.includes(i) ? 1 : 0) + (fr.includes(i) ? 1 : 0);
    const pct = revealed ? Math.round(cnt / Math.max(1, voters) * 100) : 0;
    if(revealed){
      return `<div class="poll-opt ${selected?'on':''}">
        <i class="bar" style="width:${pct}%"></i>
        <span class="box ${p.multi?'':'round'}"></span>
        <span>${esc(o)}</span>
        <span class="pct">${cnt} 票 · ${pct}%</span>
      </div>`;
    }
    return `<button class="poll-opt ${selected?'on':''}" data-act="poll-vote" data-poll="${p.id}" data-opt="${i}">
      <span class="box ${p.multi?'':'round'}"></span><span>${esc(o)}</span></button>`;
  }).join('');
  let foot = '';
  if(closed){
    foot = `<div class="poll-foot closed"><i class="dot-live"></i>投票已截止${fr.length ? ' · 结果已回收' : ' · 对方未在截止前投票'}</div>`;
  }else if(my.length && !fr.length){
    foot = `<div class="poll-foot"><i class="dot-live"></i>已投票 · 等待对方 · 剩余 ${pollCountdown(p.deadline)}</div>`;
  }else if(!my.length){
    foot = `<div class="poll-foot"><i class="dot-live"></i>${p.multi?'可多选':'一人一票'} · 剩余 ${pollCountdown(p.deadline)}</div>`;
  }else{
    foot = `<div class="poll-foot"><i class="dot-live"></i>等待结果 · 剩余 ${pollCountdown(p.deadline)}</div>`;
  }
  return `<div class="poll-head">${icon('i-vote','sm')} 投票 · ${p.multi?'多选':'单选'}</div>
    <div class="poll-body"><div class="poll-q">${esc(p.question)}</div>${opts}</div>
    ${foot}`;
}
async function pollVote(pollId, opt){
  const p = polls.find(x => x.id === pollId);
  if(!p) return;
  if(p.status !== 'open' || Date.now() > p.deadline){ toast('投票已截止'); return; }
  const idx = Number(opt);
  let arr = (p.votes.me || []).slice();
  if(p.multi){
    arr = arr.includes(idx) ? arr.filter(x => x !== idx) : arr.concat(idx);
  }else{
    arr = [idx];
  }
  p.votes.me = arr;
  await dbPut('polls', p);
  await refreshChat(false);
  toast(p.multi ? '已记录你的选择' : '投票成功');
}
function friendVote(p){
  const idxs = [];
  if(p.multi){
    p.options.forEach((o,i) => { if(Math.random() < 0.45) idxs.push(i); });
    if(!idxs.length) idxs.push(Math.floor(Math.random()*p.options.length));
  }else{
    idxs.push(Math.floor(Math.random()*p.options.length));
  }
  return idxs;
}

function approxBytes(obj){
  try{ return new Blob([JSON.stringify(obj)]).size; }catch(e){ return JSON.stringify(obj).length*2; }
}

  if(!chat) return;

  const diaryImgs = posts.filter(x => x.kind === 'diary' && (x.images||[]).length).length;

    onMount(el, close){

            await dbDelete('friendPosts', p.id);
            friendPosts = friendPosts.filter(x => x.id !== p.id);
          }
        }else{
          for(const p of friendPosts.filter(x => x.friendId === friend.id && x.kind === 'moment' && (x.images||[]).length)){
            p.images = [];
            await dbPut('friendPosts', p);
          }
        }
        toast('已删除'); again();
      });
      el.querySelectorAll('[data-delletters]').forEach(b => b.onclick = async () => {
        if(!friend) return;
        const ok = await confirmDialog({title:'删除信件', message:`确定删除与「${friend.name}」的全部信件吗？`, danger:true, confirmText:'删除'});
        if(!ok) return;
        for(const l of letters.filter(x => x.friendId === friend.id)){
          await dbDelete('letters', l.id);
          letters = letters.filter(x => x.id !== l.id);
        }
        toast('信件已删除'); again();
      });
    }
  });
}

function surveyCountdown(deadline){
  const left = Math.max(0, deadline - Date.now());
  const h = Math.floor(left/3600000), m = Math.floor(left%3600000/60000);
  return `${h} 小时 ${m} 分`;
}
function surveyBubbleHTML(q){
  const done = q.status === 'done';
  const toFriend = q.direction === 'toFriend';

  const meta = done ? '已回收 · 可查看内容'
    : expired ? '已超时，未完成回收'

  let label = '';
  if(toFriend) label = done ? '查看他的作答' : (expired ? '已超时' : '等待对方作答');
  else label = done ? '查看我的作答' : '填写问卷';
  const kinds = Array.from(new Set(q.questions.map(x => SURVEY_TYPES[x.type] || '题目'))).join(' / ');

    </div>`;

    onMount(el, close){

      const renderQs = () => {
        box.innerHTML = draft.map((q, qi) => `

              </div>`}

          const [qi, oi] = t.dataset.opt.split(':').map(Number);

        for(let i = 0; i < draft.length; i++){
          const q = draft[i];
          if(!q.q.trim()) return toast(`第 ${i+1} 题还没有写题目`);
          if(q.type !== 'essay'){
            q.options = q.options.map(x => x.trim()).filter(Boolean);
            if(q.options.length < 2) return toast(`第 ${i+1} 题至少需要两个选项`);
          }
        }
        const minS = Math.max(0, Math.floor(Number(el.querySelector('#svMin').value) || 0));
        const maxM = Math.floor(Number(el.querySelector('#svMax').value) || 0);
        if(maxM < 1) return toast('最慢时间至少 1 分钟');
        if(maxM > 1440) return toast('最慢时间最多 24 小时');
        const maxS = maxM * 60;
        if(minS >= maxS) return toast('最快时间需要小于最慢时间');
        const now = Date.now();
        const survey = {
          id:'q_'+uid(), chatId:chat.id, friendId:chat.refId, direction:'toFriend',
          title: el.querySelector('#svTitle').value.trim() || '我发起的问卷',
          questions: draft.map(q => ({
            id:'sq_'+uid(), type:q.type,
            q:q.q.trim(),
            options: q.type === 'essay' ? [] : q.options.slice(),
            answer:''
          })),
          createdAt:now, deadline:now + maxS*1000,
          minDelay:minS, maxDelay:maxM,
          status:'open', answers:{}, answeredAt:0,
          friendAnswerAt: now + (minS + Math.random()*(maxS-minS))*1000
        };
        questionnaires.unshift(survey);
        await dbPut('questionnaires', survey);
        await pushSpecialMessage(chat, 'me', 'survey', {surveyId:survey.id, content:'问卷'});
        close();
        toast(`问卷已发出 · 最慢 ${maxM} 分钟内回收`);
        setTimeout(() => openSurvey(survey.id), 120);
      };
    }
  });
}

function questionBlockHTML(q, answer, editable){
  const kind = SURVEY_TYPES[q.type] || '题目';
  let body = '';
  if(q.type === 'single' || q.type === 'truefalse'){
    body = `<div class="q-opts">${q.options.map((o,i) => `<label class="q-opt"><input type="radio" name="sq_${q.id}" value="${esc(o)}" ${answer===o?'checked':''} ${editable?'':'disabled'}>${esc(o)}</label>`).join('')}</div>`;
  }else if(q.type === 'multi'){
    const arr = Array.isArray(answer) ? answer : [];
    body = `<div class="q-opts">${q.options.map(o => `<label class="q-opt"><input type="checkbox" name="sq_${q.id}" value="${esc(o)}" ${arr.includes(o)?'checked':''} ${editable?'':'disabled'}>${esc(o)}</label>`).join('')}</div>`;
  }else if(q.type === 'order'){
    const arr = Array.isArray(answer) && answer.length ? answer : q.options;
    body = `<div class="q-opts">${arr.map((o,i) => `<div class="q-opt"><span style="flex:1">${esc(o)}</span>
      ${editable ? `<input type="number" min="1" max="${q.options.length}" value="${i+1}" data-order="${q.id}" data-opt="${esc(o)}" style="width:48px;border:1px solid var(--line-strong);border-radius:6px;padding:3px 5px">` : `<b style="font-size:10.5px;color:var(--accent)">第 ${i+1} 位</b>`}</div>`).join('')}</div>`;
  }else{
    body = editable
      ? `<textarea class="q-input" data-essay="${q.id}" placeholder="写下你的回答…">${esc(answer||'')}</textarea>`
      : `<div class="q-answer">${esc(answer || '（未作答）')}</div>`;
  }
  return `<div class="q-block"><div class="q-title"><span class="q-kind">${kind}</span>${esc(q.q)}</div>${body}</div>`;
}
function openSurvey(id){
  const q = questionnaires.find(x => x.id === id);
  if(!q) return;
  const isMine = q.direction === 'fromFriend';
  const canFill = isMine && q.status !== 'done' && Date.now() <= q.deadline;
  const chat = chatById(q.chatId);
  if(canFill){
    openSheet({
      title:'填写问卷',
      body:`<p class="form-note">${esc(q.title)} · 共 ${q.questions.length} 题 · ${surveyCountdown(q.deadline)} 后截止</p>
        <div class="sheet-body" style="padding:0">${q.questions.map((x,i) => `<div style="position:relative"><div style="position:absolute;right:8px;top:12px;font-size:10px;color:var(--text-3)">${i+1}/${q.questions.length}</div>${questionBlockHTML(x, '', true)}</div>`).join('')}</div>`,
      footer:`<button class="btn soft" data-close>稍后</button><button class="btn" id="svSubmit">提交问卷</button>`,
      onMount(el, close){
        el.querySelector('#svSubmit').onclick = async () => {
          const answers = {};
          for(const question of q.questions){
            if(question.type === 'single' || question.type === 'truefalse'){
              const checked = el.querySelector(`input[name="sq_${question.id}"]:checked`);
              answers[question.id] = checked ? checked.value : '';
            }else if(question.type === 'multi'){
              answers[question.id] = Array.from(el.querySelectorAll(`input[name="sq_${question.id}"]:checked`)).map(x => x.value);
            }else if(question.type === 'order'){
              const arr = Array.from(el.querySelectorAll(`input[data-order="${question.id}"]`))
                .map(x => ({o:x.dataset.opt, n:Number(x.value)||999}))
                .sort((a,b) => a.n - b.n)
                .map(x => x.o);
              answers[question.id] = arr;
            }else{
              const ta = el.querySelector(`textarea[data-essay="${question.id}"]`);
              answers[question.id] = ta ? ta.value.trim() : '';
            }
          }
          q.answers = answers;
          q.status = 'done';
          q.answeredAt = Date.now();
          await dbPut('questionnaires', q);
          close();
          toast('问卷已提交');
          if(chat) await refreshChat(false);
        };
      }
    });
    return;
  }
  openSheet({
    title: q.status === 'done' ? '问卷内容' : '问卷',
    body:`<p class="form-note">${esc(q.title)} · ${q.questions.length} 题 · ${q.status==='done'?'已回收':(Date.now()>q.deadline?'已超时':'等待作答中')}</p>
      <div>${q.questions.map((x,i) => `<div style="position:relative"><div style="position:absolute;right:8px;top:12px;font-size:10px;color:var(--text-3)">${i+1}</div>${questionBlockHTML(x, q.answers ? q.answers[x.id] : '', false)}</div>`).join('')}</div>`,
    footer:`<button class="btn soft" data-close>关闭</button>`
  });
}
function autoAnswerQuestion(q){
  if(q.type === 'multi'){
    const arr = q.options.filter(() => Math.random() < 0.5);
    return arr.length ? arr : [pick(q.options)];
  }
  if(q.type === 'order') return q.options.slice().sort(() => Math.random() - 0.5);
  if(q.type === 'essay') return pick(['其实我也说不太好，但想到你的时候心里是软的。','希望我们都能慢一点，好好生活，好好见面。','今天有点累，不过看到你的消息就好多了。','想和你一起把普通的日子过得久一点。','晚安，明天也要记得吃饭。']);
  return pick(q.options);
}

async function generateIncomingLetter(friendId, silent=false){
  const f = friendById(friendId);
  if(!f) return null;
  const content = composeFromPool(friendId, 10, 20, ['card','kaomoji','emoji'], {sep:'\n'});
  if(!content) return null;
  const letter = {
    id:'letter_'+uid(), friendId, dir:'in', replyTo:null,
    title: pick(['写给你的信','见字如面','夜里写下的几句话','今天想和你说','一封没有寄出的信']),
    content, at:Date.now(), status:'received', deadline:0, replyAt:0
  };
  letters.push(letter);
  await dbPut('letters', letter);
  const chat = chats.find(c => c.kind === 'friend' && c.refId === friendId);
  if(chat) await pushSpecialMessage(chat, friendId, 'letter-msg', {letterId:letter.id, content:'信封'});
  if(!silent) toast('他给你写了一封信');
  return letter;
}

function setNested(obj, path, val){
  let o = obj;
  for(let i=0;i<path.length-1;i++){
    const k = path[i];
    if(!o[k] || typeof o[k] !== 'object') o[k] = {};
    o = o[k];
  }
  o[path[path.length-1]] = val;
}

    onMount(el, close){
      const saveField = async (input) => {
        const path = input.dataset.fs.split('.');
        let value = input.type === 'checkbox' ? input.checked : input.value;
        if(path[1] === 'delayMin' || path[1] === 'delayMax'){
          const n = Number(value);
          value = Number.isFinite(n) && input.value !== '' ? Math.min(3600, Math.max(1, Math.round(n))) : (path[1] === 'delayMin' ? 30 : 60);
          input.value = value;
          if(!fm.settings.pace) fm.settings.pace = {};
          if(path[1] === 'delayMin' && Number(fm.settings.pace.delayMax || 0) < value) fm.settings.pace.delayMax = value;
          if(path[1] === 'delayMax' && Number(fm.settings.pace.delayMin || 0) > value) fm.settings.pace.delayMin = value;
        }
        if(path[1] === 'autoMin' || path[1] === 'autoMax'){
          const n = Number(value);
          value = Number.isFinite(n) && input.value !== '' ? Math.min(10, Math.max(1, Math.round(n))) : 1;
          input.value = value;
          if(!fm.settings.pace) fm.settings.pace = {};
          if(path[1] === 'autoMin' && Number(fm.settings.pace.autoMax || 0) < value) fm.settings.pace.autoMax = value;
          if(path[1] === 'autoMax' && Number(fm.settings.pace.autoMin || 0) > value) fm.settings.pace.autoMin = value;
        }
        if(path[1] === 'count' && path[0] === 'pace'){
          const n = Number(value);
          value = Number.isFinite(n) ? Math.min(10, Math.max(1, Math.round(n))) : 1;
          input.value = value;
        }
        if(path[0] === 'status' && path[1] === 'every'){
          const mins = Number(value) || 0;
          value = mins > 0 ? Math.min(1440, Math.max(1, Math.round(mins))) : '';

        setNested(fm.settings, path, value);
        if(path[0] === 'status' && path[1] === 'every'){

          fm.status.nextAt = mins > 0 ? Date.now() + mins * 60000 : 0;

async function pushSystemMessage(chat, text){
  if(!chat) return null;
  const msg = {id:'msg_'+uid(), chatId:chat.id, sender:'system', type:'system', content:text, at:Date.now(), read:true};
  await dbPut('messages', msg);
  invalidateMessages(chat.id);
  chat.lastMsg = text;
  chat.lastAt = msg.at;
  const isOpen = view.name === 'chat' && view.id === chat.id;
  if(!isOpen) chat.unread = (chat.unread || 0) + 1;
  await saveChat(chat);
  if(isOpen) await refreshChat(false);
  else if(view.name === 'messages') refreshConvList();
  return msg;
}
async function pushSpecialMessage(chat, sender, type, extra={}){
  if(!chat) return null;
  const msg = {
    id:'msg_'+uid(), chatId:chat.id, sender, type,
    content:extra.content || '', at:Date.now(), read:sender === 'me'
  };
  ['pollId','surveyId','letterId'].forEach(k => { if(extra[k]) msg[k] = extra[k]; });
  await dbPut('messages', msg);
  invalidateMessages(chat.id);
  chat.lastMsg = msgPreview(chat, msg);
  chat.lastAt = msg.at;
  const isOpen = view.name === 'chat' && view.id === chat.id;
  if(sender === 'me') chat.unread = 0;
  else chat.unread = isOpen ? 0 : (chat.unread || 0) + 1;
  await saveChat(chat);
  if(isOpen) await refreshChat(false);
  else if(view.name === 'messages') refreshConvList();
  return msg;
}

async function maybeGenerateFriendContent(friendId, opening=false){
  const f = friendById(friendId);
  if(!f) return;
  const fm = friendMetaOf(friendId);
  const now = Date.now();
  let changed = false;
  if(now - (fm.lastPostAt || 0) > 2*3600*1000 && Math.random() < (opening ? .45 : .004)){
    await generateFriendPost(friendId, 'moment');
    changed = true;
  }
  if(dayKey(now) !== dayKey(fm.lastDiaryAt || 0) && Math.random() < (opening ? .35 : .02)){
    await generateFriendPost(friendId, 'diary');
    changed = true;
  }
  const lastIn = letters.filter(l => l.friendId === friendId && l.dir === 'in').sort((a,b) => (b.at||0) - (a.at||0))[0];
  const pendingOut = letters.some(l => l.friendId === friendId && l.dir === 'out' && !l.replyTo && l.status === 'pending');
  if(!pendingOut && now - (lastIn ? lastIn.at : 0) > 8*3600*1000 && Math.random() < (opening ? .14 : .0009)){
    await generateIncomingLetter(friendId, true);
    changed = true;
  }
  if(changed) await saveFriendMeta(fm);
}

async function processTimedFeatures(now){
  let needRefresh = false;
  const openChatId = view.name === 'chat' ? view.id : null;

  for(const f of friends){
    const fm = friendMetaOf(f.id);
    if(rollFriendStatus(fm, false)){
      await saveFriendMeta(fm);
      syncStatusDom(fm);
    }
  }

  for(const p of polls){
    if(p.status !== 'open') continue;
    if(p.friendVoteAt && now >= p.friendVoteAt && !((p.votes && p.votes.friend) || []).length){
      p.votes = p.votes || {me:[], friend:[]};
      p.votes.friend = friendVote(p);
      p.friendVoteAt = 0;
      await dbPut('polls', p);
      if(openChatId && p.chatId === openChatId) needRefresh = true;
    }
    if(now >= p.deadline){
      p.status = 'closed';
      await dbPut('polls', p);
      if(openChatId && p.chatId === openChatId) needRefresh = true;
    }
  }

  for(const q of questionnaires){
    if(q.status !== 'open') continue;
    if(q.direction === 'toFriend' && q.friendAnswerAt && now >= q.friendAnswerAt && now <= q.deadline){
      const answers = {};
      q.questions.forEach(qu => { answers[qu.id] = autoAnswerQuestion(qu); });
      q.answers = answers;
      q.status = 'done';
      q.answeredAt = now;
      q.friendAnswerAt = 0;
      await dbPut('questionnaires', q);
      if(openChatId && q.chatId === openChatId) needRefresh = true;
    }else if(now > q.deadline){
      q.status = 'expired';
      await dbPut('questionnaires', q);
      if(openChatId && q.chatId === openChatId) needRefresh = true;
    }
  }

  for(const l of letters.slice()){
    if(l.dir !== 'out' || l.replyTo || l.status !== 'pending') continue;
    if(now > l.deadline){
      l.status = 'expired';
      await dbPut('letters', l);
      continue;
    }
    if(!l.replyAt || now < l.replyAt) continue;
    const f = friendById(l.friendId);
    if(!f) continue;
    const replyContent = composeFromPool(l.friendId, 10, 20, ['card','kaomoji','emoji'], {sep:'\n'});
    if(!replyContent) continue;
    const reply = {
      id:'letter_'+uid(), friendId:l.friendId, dir:'in', replyTo:l.id,
      title: pick(['回信','收到你的信了','想和你说']),
      content: replyContent,
      at:now, status:'received', deadline:0, replyAt:0
    };
    letters.push(reply);
    await dbPut('letters', reply);
    l.status = 'replied';
    await dbPut('letters', l);
    const chat = chats.find(c => c.kind === 'friend' && c.refId === l.friendId);
    if(chat) await pushSpecialMessage(chat, l.friendId, 'letter-msg', {letterId:reply.id, content:'信封'});
  }

  for(const p of friendPosts){
    if(!p.pendingReplyAt || now < p.pendingReplyAt) continue;
    const cpool = libTextPool(p.friendId, ['card','kaomoji','emoji']);
    if(!cpool.length) continue;
    p.pendingReplyAt = 0;
    const f = friendById(p.friendId);
    p.comments = p.comments || [];
    p.comments.push({
      by:'friend', name:(f && f.name) || 'TA',
      text: pick(cpool),
      at:now
    });
    await dbPut('friendPosts', p);
    toast(`「${(f && f.name) || 'TA'}」回复了你的评论`);
  }

  if(needRefresh) await refreshChat(false);
  if(view.name === 'chat'){
    const chat = chatById(view.id);
    if(chat && chat.kind === 'friend'){
      await maybeGenerateFriendContent(chat.refId, false);
      maybeIncomingCall();
    }
  }
}

/* ============ 音效 ============ */
let audioCtx = null;
function audioContext(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{ audioCtx = new AC(); }catch(err){ return null; }
  }
  if(audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}
function tone(freq, delay, dur, vol, type = 'sine', slideTo = 0){
  const ctx = audioContext();
  if(!ctx) return;
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}

}
function playMessageSound(soft = false){

}

/* ============ 通用：Toast / Sheet / 确认框 ============ */
let toastTimer = null;
function toast(message){
  const root = $('#toastRoot');
  if(!root) return;
  root.innerHTML = `<div class="toast">${esc(message)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, 2000);
}

function openSheet(config={}){
  closeSheet();
  const title = config.title || '';
  const body = config.body || '';
  const footer = config.footer || '';
  const onMount = config.onMount;
  const root = $('#sheetRoot');
  if(!root) return;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <h3>${esc(title)}</h3>
        <button class="sheet-close" type="button" aria-label="关闭">${icon('i-close')}</button>
      </div>
      <div class="sheet-body">${body}</div>
      ${footer ? `<div class="sheet-actions">${footer}</div>` : ''}
    </div>`;
  root.appendChild(overlay);
  currentSheet = overlay;
  const close = () => closeSheet();
  overlay.addEventListener('click', e => { if(e.target === overlay) close(); });
  const closeBtn = overlay.querySelector('.sheet-close');
  if(closeBtn) closeBtn.onclick = close;
  overlay.querySelectorAll('[data-close]').forEach(btn => { btn.onclick = close; });
  document.addEventListener('keydown', sheetEscHandler);
  if(typeof onMount === 'function') onMount(overlay.querySelector('.sheet'), close);
}

function sheetEscHandler(e){
  if(e.key === 'Escape') closeSheet();
}

function closeSheet(){
  document.removeEventListener('keydown', sheetEscHandler);
  const root = $('#sheetRoot');
  if(root) root.innerHTML = '';
  currentSheet = null;
}

function confirmDialog(config={}){
  const title = config.title || '确认操作';
  const message = config.message || '';
  const danger = !!config.danger;
  const confirmText = config.confirmText || '确定';
  const cancelText = config.cancelText || '取消';
  return new Promise(resolve => {
    const root = $('#modalRoot');
    if(!root){ resolve(false); return; }
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
        <h3>${esc(title)}</h3>
        <p>${esc(message)}</p>
        <div class="modal-actions">
          <button class="btn soft" type="button" data-no>${esc(cancelText)}</button>
          <button class="btn ${danger ? 'danger' : ''}" type="button" data-yes>${esc(confirmText)}</button>
        </div>
      </div>`;
    root.appendChild(wrap);
    const finish = value => { wrap.remove(); resolve(value); };
    wrap.querySelector('[data-yes]').onclick = () => finish(true);
    wrap.querySelector('[data-no]').onclick = () => finish(false);
    wrap.addEventListener('click', e => { if(e.target === wrap) finish(false); });
  });
}

function softRender(){
  const main = $('#main');
  const top = main ? main.scrollTop : 0;
  render();
  const next = $('#main');
  if(next) next.scrollTop = top;
}

        try{

function scheduleMomentReactions(moment){
  if(!friends.length) return;
  setTimeout(async () => {
    const fresh = moments.find(x => x.id === moment.id);
    if(!fresh) return;
    const pool = friends.slice().sort(() => Math.random() - 0.5);
    const likeCount = Math.min(pool.length, 1 + Math.floor(Math.random()*3));
    const likedBy = pool.slice(0, likeCount);
    fresh.likes = Array.from(new Set([...(fresh.likes || []), ...likedBy.map(f => f.id)]));
    const commentCount = 1 + Math.floor(Math.random()*Math.min(2, pool.length));
    const lines = ['真好呀。','看起来很舒服。','下次也带上我吧。','哈哈哈哈，太懂了。','这一刻值得记住。','今天也要开心。'];
    fresh.comments = [...(fresh.comments || [])];
    for(let i = 0; i < commentCount; i++){
      const f = pool[i % pool.length];
      fresh.comments.push({id:'cmt_'+uid(), userId:f.id, name:f.name, text:pick(lines), at:Date.now()});
    }
    await dbPut('moments', fresh);
    if(view.name === 'moments') softRender();
  }, 5000 + Math.random()*12000);
}

async function toggleMomentLike(id){
  const m = moments.find(x => x.id === id);
  if(!m) return;
  const likes = new Set(m.likes || []);
  if(likes.has('me')) likes.delete('me'); else likes.add('me');
  m.likes = Array.from(likes);
  await dbPut('moments', m);
  softRender();
}

function openMomentComment(id){

    : '';
  openSheet({
    title:'评论',
    body:`${existing}<div class="field"><label>说点什么</label><textarea class="textarea" id="mcText" maxlength="300" placeholder="写下你的评论…"></textarea></div>`,

}

async function deleteMoment(id){
